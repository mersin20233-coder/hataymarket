<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="bagGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="boltGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadowMask" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Full bleed background for maskable icon -->
  <rect width="512" height="512" fill="url(#bgGradMask)" />

  <!-- Content scaled and centered to fit safely within the 80% circle (center 256, 256, radius ~200) -->
  <g transform="translate(64, 64) scale(0.75)" filter="url(#shadowMask)">
    <!-- Bag handles -->
    <path d="M196 170 C196 130 220 98 256 98 C292 98 316 130 316 170" 
          fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" />
    
    <!-- Bag body -->
    <path d="M152 182 L360 182 L384 396 C384 416 368 432 348 432 L164 432 C144 432 128 416 128 396 Z" 
          fill="url(#bagGradMask)" />
    
    <!-- Lightning bolt -->
    <path d="M268 214 L216 304 L260 304 L244 380 L308 288 L268 288 Z" 
          fill="url(#boltGradMask)" />
  </g>
</svg>
